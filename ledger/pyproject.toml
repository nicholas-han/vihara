[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.0.1"
description = "Double-entry bookkeeping over an authoritative SQLite store with a built-in web app; beancount text is the import/export interchange format."
requires-python = ">=3.11"
dependencies = ["instrument_manager"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "beancount>=2.3,<3"]

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.setuptools.package-data]
ledger = ["investment/persistence/*.sql"]
