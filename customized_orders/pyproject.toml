[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vihara-customized-orders"
version = "0.1.0"
description = "Durable client-orchestrated Limit with MOC orders"
requires-python = ">=3.11"
dependencies = ["vihara-plumber"]
[project.scripts]
vihara-order = "customized_orders.cli:main"
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[tool.setuptools.packages.find]
include = ["customized_orders*"]
